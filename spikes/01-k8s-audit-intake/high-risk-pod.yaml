apiVersion: v1
kind: Pod
metadata:
  name: high-risk-pod
  labels:
    spike: audit-intake
spec:
  hostNetwork: true
  hostPID: true
  hostIPC: true
  containers:
    - name: high-risk-container
      image: busybox:1.36
      command: ["sleep", "3600"]
      securityContext:
        privileged: true
      volumeMounts:
        - name: host-root
          mountPath: /host
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory
