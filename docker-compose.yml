# Docker Compose reference environment (ARCH-01 §7): exactly two
# services, the application and PostgreSQL, on a single host. See
# docs/reference-environment.md for setup, verification, and the
# Scenario 1 end-to-end demonstration.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cnsdp
      POSTGRES_USER: cnsdp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- copy .env.example to .env and fill it in; see docs/reference-environment.md}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cnsdp -d cnsdp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      DATABASE_URL: postgres://cnsdp:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set -- copy .env.example to .env and fill it in; see docs/reference-environment.md}@postgres:5432/cnsdp?sslmode=disable
      API_TOKEN: ${API_TOKEN:?API_TOKEN must be set -- copy .env.example to .env and fill it in; see docs/reference-environment.md}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-10485760}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
    ports:
      # Bound to loopback only: the documented workflow (readiness check,
      # Scenario 1 demonstration) never needs LAN exposure on this
      # single-host reference environment. Only the host-side port is
      # configurable (APP_PORT, default 8080) -- the container's own
      # listen address (:8080, HTTP_ADDR's default) never changes.
      # Override APP_PORT in .env (or on the command line) if 8080 is
      # already in use locally; see docs/reference-environment.md.
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres-data:
